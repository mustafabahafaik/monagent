[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"

# Explorer doğrulaması için: IPFS hash'i kapalı, kaynak kod metadata'ya gömülür
bytecode_hash = "none"
use_literal_content = true

# Deploy scripti adresi frontend ve agent config dosyalarına yazabilsin (Foundry varsayılanda dışarı yazmaz)
fs_permissions = [
  { access = "write", path = "../frontend/src" },
  { access = "write", path = "../agent" },
]

# --rpc-url monad_testnet yazınca kullanılacak adres
[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
